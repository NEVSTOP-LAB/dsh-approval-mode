name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release body lists what changed since
          # the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi
      - name: Syntax check
        run: npm run check
      - name: Pack tarball
        run: npm run pack
      - name: Compose release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --pretty='- %s' "$PREV..${GITHUB_REF_NAME}" > commits.txt
          else
            git log --pretty='- %s' "${GITHUB_REF_NAME}" > commits.txt
          fi
          node scripts/release-notes.mjs \
            --version "${GITHUB_REF_NAME}" \
            --changelog CHANGELOG.md \
            --commits commits.txt \
            --sha "${GITHUB_SHA}" \
            --out release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} dsh-approval-mode
          body_path: release-notes.md
          files: dist/*.tgz
